<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Voxt Soft Cues</title>
<style>body{font:15px -apple-system,sans-serif;max-width:720px;margin:32px auto;padding:0 16px;background:#fafafa;color:#222}
.row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:10px 0;border-bottom:1px solid #eee}
.n{font-weight:600}.d{color:#777;font-size:13px}.b{grid-row:1/3;grid-column:2;display:flex;gap:8px;align-self:center;flex-wrap:wrap;justify-content:flex-end}
button{padding:7px 12px;border-radius:8px;border:1px solid #ccc;background:#fff;color:inherit;cursor:pointer;font:inherit}
.h{min-width:64px}.h.on{border-color:#e0457b;color:#e0457b}.bar{display:flex;gap:8px;align-items:center;margin:12px 0}
@media(prefers-color-scheme:dark){body{background:#1c1c1e;color:#eee}button{background:#2c2c2e;border-color:#444}.row{border-color:#333}.h.on{border-color:#ff6b9a;color:#ff6b9a}}
@media(max-width:560px){.row{grid-template-columns:1fr}.b{grid-row:auto;grid-column:auto;justify-content:flex-start}}</style>
<h2>Voxt 柔和提示音</h2><p class="d">每组是 Voxt 开始录音 / 结束录音时的提示音。听完喜欢哪个，就点后面的 ♡（每个声音每台设备一颗心）。建议戴耳机听。</p>
<div class="bar"><button id="sort">按心数排序</button><span class="d" id="st"></span></div>
<div id="l"></div><script>
const R=[{"id": "soft-wood", "name": "木琴 Wood", "desc": "软槌木琴"}, {"id": "soft-vibes", "name": "颤音琴 Vibraphone", "desc": "毛线槌颤音琴，带轻微颤动"}, {"id": "soft-bowl", "name": "颂钵 Singing Bowl", "desc": "木棒轻敲颂钵，有金属共振"}, {"id": "soft-woodblock", "name": "木鱼 Wood Block", "desc": "最“顿”、最短"}, {"id": "soft-musicbox", "name": "八音盒 Music Box", "desc": "八音盒，清亮"}, {"id": "soft-kalimba", "name": "卡林巴 Kalimba", "desc": "拨片"}, {"id": "soft-celesta", "name": "钢片琴 Celesta", "desc": "轻巧的小铃声"}, {"id": "soft-glock", "name": "钟琴 Glockenspiel", "desc": "软槌钟琴，清脆"}, {"id": "soft-xylophone", "name": "木片琴 Xylophone", "desc": "短促轻快的木头声"}, {"id": "soft-steeldrum", "name": "钢鼓 Steel Drum", "desc": "圆润有弹性"}, {"id": "soft-guzheng", "name": "古筝 Guzheng", "desc": "柔化的古筝拨弦，不那么写实"}, {"id": "soft-muted-guitar", "name": "闷音吉他 Muted Guitar", "desc": "手掌闷住的吉他拨弦，暗、很顿"}, {"id": "soft-toy-piano", "name": "玩具钢琴 Toy Piano", "desc": "可爱的小金属棒"}, {"id": "soft-bamboo", "name": "竹琴 Bamboo", "desc": "空心竹子的笃笃声"}, {"id": "soft-agogo", "name": "阿哥哥铃 Agogo", "desc": "高低双铃，轻快"}, {"id": "soft-bloom", "vars": ["soft-bloom-1", "soft-bloom-2", "soft-bloom-3", "soft-bloom-4", "soft-bloom-5", "soft-bloom-6"], "name": "和弦绽放 Bloom", "desc": "每次随机换一个和弦（C、F、G、Am、Fmaj7、Cmaj7），不会连着重复"}], NS='voxt-soft-cues-v1', API='https://abacus.jasoncameron.dev';
let ctx, cur; const buf={};
const decode=async id=>buf[id]||(buf[id]=await ctx.decodeAudioData(await (await fetch('voxt-soft-cues/sounds/'+id+'.wav')).arrayBuffer()));
const play=async(id,delay=0)=>{ctx=ctx||new AudioContext();if(ctx.state!=='running')await ctx.resume();
  const b=await decode(id);const s=ctx.createBufferSource();s.buffer=b;s.connect(ctx.destination);
  if(cur&&!delay)try{cur.stop()}catch(e){};s.start(ctx.currentTime+delay);cur=s;window.lastPlayed=id};
const mine=(()=>{try{return JSON.parse(localStorage.getItem('cueHearts')||'[]')}catch(e){return []}})();
const save=()=>{try{localStorage.setItem('cueHearts',JSON.stringify(mine))}catch(e){}};
const count={}, els={};
const show=id=>{const b=els[id];if(!b)return;const on=mine.includes(id);b.classList.toggle('on',on);b.textContent=(on?'❤️ ':'♡ ')+(count[id]??'·')};
for(const r of R){const d=document.createElement('div');d.className='row';d.dataset.id=r.id;
d.innerHTML=`<div class=n>${r.name}</div><div class=d>${r.desc}</div><div class=b><button>开始</button><button>结束</button><button>开始→结束</button><button class=h>♡ ·</button></div>`;
const [a,b,c,h]=d.querySelectorAll('button');let last;els[r.id]=h;
const pick=(fresh)=>{if(!r.vars)return r.id;if(fresh||!last){const o=r.vars.filter(v=>v!==last);last=o[Math.floor(Math.random()*o.length)]}return last};
a.onclick=()=>play(pick(true)+'-start');b.onclick=()=>play(pick(false)+'-stop');
c.onclick=async()=>{const v=pick(true);await play(v+'-start');play(v+'-stop',1.0)};
h.onclick=async()=>{if(mine.includes(r.id))return;mine.push(r.id);save();count[r.id]=(count[r.id]||0)+1;show(r.id);
  try{const j=await (await fetch(`${API}/hit/${NS}/${r.id}`)).json();if(typeof j.value==='number')count[r.id]=j.value}catch(e){}show(r.id)};
document.getElementById('l').appendChild(d);show(r.id)}
// read every count (a sound nobody has hearted yet has no counter: 0)
Promise.all(R.map(async r=>{try{const res=await fetch(`${API}/get/${NS}/${r.id}`);const j=await res.json();count[r.id]=typeof j.value==='number'?j.value:0}catch(e){}show(r.id)}))
 .then(()=>{const t=R.reduce((s,r)=>s+(count[r.id]||0),0);document.getElementById('st').textContent=`一共 ${t} 颗心`});
document.getElementById('sort').onclick=()=>{const l=document.getElementById('l');
  [...l.children].sort((x,y)=>(count[y.dataset.id]||0)-(count[x.dataset.id]||0)).forEach(e=>l.appendChild(e))};
</script>
